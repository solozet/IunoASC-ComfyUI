name: Build IunoASC ComfyUI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n start.sh
      - run: python3 -m compileall -q panel preflight.py
      - run: python3 -m unittest discover -s tests -v

  docker:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '13.0.2'
            torch_index: cu130
            tag: torch2.9.1-cu130-r3
          - cuda: '12.8.1'
            torch_index: cu128
            tag: torch2.9.1-cu128-r3
          # These change the NVIDIA base, NOT the PyTorch wheel's CUDA version.
          # PyTorch 2.9.1 has no official cu131/cu132 wheels.
          - cuda: '13.1.1'
            torch_index: cu130
            tag: torch2.9.1-cu130-base13.1.1-r3
          - cuda: '13.2.0'
            torch_index: cu130
            tag: torch2.9.1-cu130-base13.2.0-r3
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui:${{ matrix.tag }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}
            TORCH_INDEX=${{ matrix.torch_index }}
