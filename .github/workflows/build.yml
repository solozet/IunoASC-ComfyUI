name: Build IunoASC ComfyUI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n start.sh
      - run: python3 -m compileall -q panel preflight.py
      - run: pip install fastapi==0.115.12 huggingface_hub httpx
      - run: python3 -m unittest discover -s tests -v
      - run: npm install --prefix /tmp/iuno-ui-tests jsdom@26
      - run: IUNO_JSDOM_PATH=/tmp/iuno-ui-tests/node_modules/jsdom node tests/test_frontend.cjs

  docker:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '13.0.2'
            torch_index: cu130
            tag: comfy0.38.0-cu130
            alias: cu130
          - cuda: '12.8.1'
            torch_index: cu128
            tag: comfy0.38.0-cu128
            alias: cu128
          # These change the NVIDIA base, NOT the PyTorch wheel's CUDA version.
          # PyTorch 2.9.1 has no official cu131/cu132 wheels.
          - cuda: '13.1.1'
            torch_index: cu130
            tag: comfy0.38.0-cu131
            alias: cu131
          - cuda: '13.2.0'
            torch_index: cu130
            tag: comfy0.38.0-cu132
            alias: cu132
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui:${{ matrix.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui:${{ matrix.alias }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}
            TORCH_INDEX=${{ matrix.torch_index }}
