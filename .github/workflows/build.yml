name: Build IunoASC ComfyUI
on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cuda: '13.0.2'
            torch_index: cu130
            tag: torch2.9.1-cu130
          - cuda: '12.8.1'
            torch_index: cu128
            tag: torch2.9.1-cu128
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/comfyui:${{ matrix.tag }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda }}
            TORCH_INDEX=${{ matrix.torch_index }}
