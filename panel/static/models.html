<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IunoASC — Models</title><link rel="stylesheet" href="./style.css"></head>
<body data-mode="models"><main class="wrap">
<header class="top"><div class="logo">Iuno<span>ASC</span> / tools</div><div class="header-actions"><nav class="nav"><a href="/" class="current" data-i18n="models">Модели</a><a id="comfy-link" href="/" target="_blank">ComfyUI ↗</a><a id="outputs-link" href="/" target="_blank" data-i18n="outputs">Результаты</a></nav><select id="language" class="language" aria-label="Language"><option value="en">EN</option><option value="ru" selected>RU</option><option value="de">DE</option><option value="fr">FR</option><option value="zh">中文</option><option value="ja">日本語</option></select></div></header>
<div class="eyebrow">MODEL STATION · HUGGING FACE</div><h1 data-i18n="modelsTitle">Всё для генерации.\nВ одном месте.</h1><p class="lead" data-i18n="modelsLead"></p>
<div id="preset-cards" class="preset-grid"><p class="muted" data-i18n="loading">Загружаем пресеты…</p></div>
<section class="card subcard"><div class="eyebrow" data-i18n="extra">ДОПОЛНИТЕЛЬНЫЕ ВЕСА</div><h2 data-i18n="hfTitle">Скачать с Hugging Face</h2><p data-i18n="hfLead"></p>
<label for="weight-source" data-i18n="source">Репозиторий или ссылка на файл</label><input id="weight-source" data-i18n-placeholder="sourcePlaceholder" placeholder="автор/репозиторий или https://huggingface.co/…">
<label for="weight-type" data-i18n="weightType">Тип весов</label><select id="weight-type"><option value="loras" data-i18n="typeLora">LoRA</option><option value="diffusion_models" data-i18n="typeDiffusion">Диффузионная модель</option><option value="text_encoders" data-i18n="typeEncoder">Текстовый энкодер</option><option value="vae" data-i18n="typeVae">VAE</option></select><div id="weight-destination" class="destination"></div>
<label for="weight-token" data-i18n="token">HF-токен (если нужен доступ)</label><input id="weight-token" type="password" autocomplete="off" placeholder="hf_…">
<div class="row"><button class="secondary" id="inspect-weight" data-i18n="inspect">Найти файлы</button></div>
<div id="weight-picker" class="hidden"><label for="weight-file" data-i18n="file">Файл</label><select id="weight-file"></select><div class="row"><button id="download-weight" data-i18n="download">↓ Скачать вес</button></div></div><div class="status" id="weight-status" role="status"></div></section>
<p class="foot" data-i18n="modelsFoot"></p></main><script src="./app.js"></script></body></html>
