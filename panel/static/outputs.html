<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IunoASC — Outputs</title><link rel="stylesheet" href="./style.css"></head>
<body data-mode="outputs"><main class="wrap wide">
<header class="top"><div class="logo">Iuno<span>ASC</span> / tools</div><div class="header-actions"><select id="language" class="language" aria-label="Language"><option value="en">EN</option><option value="ru" selected>RU</option><option value="de">DE</option><option value="fr">FR</option><option value="zh">中文</option><option value="ja">日本語</option></select><nav class="nav"><a id="control-link" href="/" target="_blank" data-i18n="control">Панель управления</a><a id="comfy-link" href="/" target="_blank">ComfyUI ↗</a><a id="models-link" href="/" target="_blank" data-i18n="models">Модели</a><a href="/" class="current" data-i18n="outputs">Результаты</a></nav></div></header>
<div class="eyebrow">OUTPUT STATION · FILES</div><h1 data-i18n="outputsTitle">Забери свои результаты.</h1><p class="lead" data-i18n="outputsLead"></p>
<section class="card backup-card"><div class="eyebrow" data-i18n="browserBackup"></div><h2 data-i18n="backupTitle"></h2><p data-i18n="backupLead"></p><label class="checkbox-label"><input id="cache-outputs" type="checkbox" checked><span data-i18n="cacheAutomatic"></span></label><div class="row"><button id="download-cached" class="danger-button" data-i18n="downloadCached" disabled></button><span id="cache-count" class="muted"></span></div><div id="cache-status" class="status" role="status"></div><details id="cached-files"><summary data-i18n="cachedFiles"></summary><div id="cached-file-list"></div></details><p class="foot" data-i18n="cacheNote"></p></section><div class="outputs-layout"><section class="card"><div class="row" style="margin-top:0"><a class="button" id="download-archive" href="./api/outputs/archive" data-i18n="archive">↓ Скачать все outputs · ZIP</a><button class="secondary" id="refresh-outputs" data-i18n="refresh">Обновить</button></div><div class="path" style="margin-top:26px"><button class="secondary" id="up-folder" style="padding:7px 11px" aria-label="Parent folder">←</button><code id="folder-path">/outputs</code></div><div id="output-list" class="files"></div><div id="output-status" class="status" role="status"></div></section>
<aside class="card"><div class="eyebrow" data-i18n="beforeStop">ПЕРЕД ЗАВЕРШЕНИЕМ</div><h2 data-i18n="checkArchive">Проверь скачанное на ПК</h2><ol class="flow"><li><b>01</b><span data-i18n="step1"></span></li><li><b>02</b><span data-i18n="step2"></span></li><li><b>03</b><span data-i18n="step3"></span></li></ol><div class="foot" data-i18n="diskNote"></div></aside></div><section class="card subcard"><h2 data-i18n="session"></h2><p data-i18n="sessionLead"></p><label class="checkbox-label"><input type="checkbox" id="include-inputs" checked><span data-i18n="includeInputs"></span></label><div class="row"><button id="save-session" data-i18n="session"></button><span id="selected-count" class="muted"></span></div><div id="session-status" class="status" role="status"></div></section><dialog id="video-dialog"><div class="dialog-top"><h2 id="video-name"></h2><button id="close-video" class="secondary" data-i18n="close"></button></div><video id="video-player" controls playsinline preload="metadata"></video><div id="video-meta" class="muted"></div><div id="preview-status" class="status" role="status"></div></dialog><p class="foot" data-i18n="outputsFoot"></p></main><script src="./zip-native.min.js"></script><script src="./output-backup.js"></script><script src="./app.js"></script></body></html>
